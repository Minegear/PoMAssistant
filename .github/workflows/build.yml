name: build-and-push

on:
  push:
    branches: [main, dev]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    # Environnements GitHub "prod" (branche main) et "dev" (branche dev) :
    # Variables VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY.
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

    steps:
      - uses: actions/checkout@v4
      - name: Nom de l'image
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "TAG=$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Un tag du commit
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:${{ github.ref_name }}
          build-args: |
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Mettre à jour le déploiement (homelab-devops)
        if: github.ref_name == 'dev'
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          git clone "https://x-access-token:${GITOPS_TOKEN}@github.com/antonkr1/homelab-devops.git" gitops
          cd gitops
          sed -i "s|image: ghcr.io/antonkr1/pomassistant:.*|image: ${IMAGE}:${TAG}|" apps/pomassistant/deployment.yaml
          if git diff --quiet; then
            echo "Aucun changement à déployer."
            exit 0
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git commit -am "pomassistant: déployer ${TAG}"
          git pull --rebase origin main
          git push origin HEAD:main